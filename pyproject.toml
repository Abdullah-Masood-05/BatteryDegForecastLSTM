[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-forecast"
version = "1.0.0"
description = "Forecasting smartphone battery degradation from sensor telemetry with an LSTM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abdullah Masood" }]
keywords = ["lstm", "time-series", "forecasting", "battery", "tensorflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.scripts]
battery-forecast = "battery_forecast.cli:main"

[project.urls]
Repository = "https://github.com/Abdullah-Masood-05/BatteryDegForecastLSTM"
Dashboard = "https://abdullah-masood-05.github.io/BatteryDegForecastLSTM/"
Dataset = "https://www.kaggle.com/datasets/rahulgarg28/mobile-battery-with-time"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]
